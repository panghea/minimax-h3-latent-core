# Publishes to PyPI when a GitHub Release is created.
#
# No API token is stored anywhere. PyPI is configured to trust this exact
# (owner, repo, workflow file, environment) tuple, and GitHub hands it a short-lived OIDC token
# at publish time. Set that up once at
#   https://pypi.org/manage/account/publishing/  ->  Add a new pending publisher
name: publish

on:
  release:
    types: [published]

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the build needs no token left behind in .git/config
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # must match the environment named in the Trusted Publisher
    permissions:
      id-token: write          # required for OIDC; without it the exchange fails
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
