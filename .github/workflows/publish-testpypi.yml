# Manual dry run against TestPyPI, so a mistake in the metadata is found before a version number
# is burned on the real index. PyPI never lets a version be re-uploaded, even after a delete.
#
# Needs its own pending publisher at https://test.pypi.org/manage/account/publishing/ with
#   workflow: publish-testpypi.yml    environment: testpypi
name: publish (TestPyPI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
