# Manual dry run against TestPyPI, so a mistake in the metadata is found before a version number
# is burned on the real index. PyPI never lets a version be re-uploaded, even after a delete.
#
# Needs its own pending publisher at https://test.pypi.org/manage/account/publishing/ with
#   workflow: publish-testpypi.yml    environment: testpypi
name: publish (TestPyPI)

on:
  workflow_dispatch:

# Actions are pinned by commit SHA, not by tag. A tag can be moved by whoever owns the action,
# and the publish step below holds the OIDC token that can push to PyPI. Update these
# deliberately; the version each SHA corresponds to is in the comment beside it.
#
# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # the build needs no token left behind in .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
